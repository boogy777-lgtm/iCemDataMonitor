name: rust-migration
on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust-migration.yml"]
  pull_request:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust-migration.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          # rustup installs the toolchain/components from rust/rust-toolchain.toml.
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch locked Rust dependencies
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source and skeleton
        shell: pwsh
        run: ./tools/Verify-Scaffold.ps1 -RequireCompleteBaseline
      - name: Check preserved dashboard in Chrome
        if: runner.os == 'Linux'
        shell: bash
        env:
          ICEM_UI_ARTIFACTS: ${{ runner.temp }}/icem-ui
        run: |
          npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
          node tools/browser/theme-contract.cjs
          node tools/browser/dashboard.cjs
      - name: Upload dashboard evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: preserved-dashboard
          path: ${{ runner.temp }}/icem-ui
          if-no-files-found: ignore
      - name: Upload emulator differential evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-differential
          path: |
            rust/target/emu-differential-report.json
            rust/target/dfb-differential-report.json
            rust/target/lan-differential-report.json
          if-no-files-found: ignore
