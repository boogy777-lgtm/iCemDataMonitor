name: rust-migration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    # Run for legacy changes too: the immutable baseline guard covers the root tree.
    # Cold MSVC check + build of the locked GPUI graph exceeded 15m.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          # rustup installs the toolchain/components from rust/rust-toolchain.toml.
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify owned Host diagnostic window on Windows
        shell: pwsh
        run: |
          cargo test --locked -p icem-windows-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows file logger boundary before desktop build
        shell: pwsh
        run: |
          cargo test --locked -p icem-logging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows emulator integration before desktop build
        shell: pwsh
        run: |
          # Test the native runtime boundary before the much larger desktop graph.
          # Cargo downloads only this locked package closure on the cold runner.
          cargo test --locked -p icem-emulator-app -p icem-transport -p icem-platform-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --offline --all-targets -p icem-emulator-app -p icem-transport -p icem-platform-windows -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch locked Rust dependencies
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source and skeleton
        shell: pwsh
        run: ./tools/Verify-Scaffold.ps1 -RequireCompleteBaseline
      - name: Check preserved dashboard in Chrome
        shell: pwsh
        env:
          ICEM_UI_ARTIFACTS: ${{ runner.temp }}/icem-ui
        run: |
          npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/browser/theme-contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/browser/dashboard.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preserved-dashboard
          path: ${{ runner.temp }}/icem-ui
          if-no-files-found: ignore
      - name: Upload emulator differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-differential
          path: |
            rust/target/control-differential-report.json
            rust/target/emu-differential-report.json
            rust/target/dfb-differential-report.json
            rust/target/lan-differential-report.json
            rust/target/host-sniffer-differential-report.json
          if-no-files-found: ignore
