name: ci-inputs
on:
  workflow_call:
    outputs:
      legacy:
        value: ${{ jobs.classify.outputs.legacy }}
      rust:
        value: ${{ jobs.classify.outputs.rust }}
      packaging:
        value: ${{ jobs.classify.outputs.packaging }}
permissions:
  contents: read
jobs:
  classify:
    timeout-minutes: 5
    runs-on: windows-latest
    outputs:
      legacy: ${{ steps.route.outputs.legacy }}
      rust: ${{ steps.route.outputs.rust }}
      packaging: ${{ steps.route.outputs.packaging }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify verified changed paths (unknown input selects all)
        id: route
        shell: pwsh
        run: python rust/tools/ci/routing.py classify
  baseline:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test immutable baseline guard
        shell: pwsh
        run: ./rust/tools/Test-BaselineGuard.ps1
      - name: Verify complete legacy baseline and approvals
        shell: pwsh
        run: ./rust/tools/Verify-Baseline.ps1 -RequireComplete
  routing-tests:
    timeout-minutes: 5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Routing, diff, dependency and family gate contracts
        shell: pwsh
        run: python -m unittest discover -s rust/tools/ci -p "test_*.py" -v
