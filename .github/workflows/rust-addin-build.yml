name: rust-addin-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  net48-addin:
    runs-on: [self-hosted, Windows, X64, icem-sdk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build unchanged net48 project with the installed proprietary SDK
        shell: pwsh
        run: ./src/rust/tools/Build-LegacyAddin.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'net48-addin')
      - name: Upload verified AddIn only (no vendor SDK redistribution)
        uses: actions/upload-artifact@v4
        with:
          name: net48-addin
          path: |
            ${{ runner.temp }}/net48-addin/Burservis.iCem.DataMonitor.dll
            ${{ runner.temp }}/net48-addin/addin-manifest.json
          if-no-files-found: error
