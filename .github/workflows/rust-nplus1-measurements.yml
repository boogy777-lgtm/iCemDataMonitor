name: rust-nplus1-measurements
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-measurements:
    runs-on: windows-latest
    # Independent cold Release/GPUI build must not exhaust the debug gate's budget.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: src/rust
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check heap evidence validation
        shell: pwsh
        run: python -m unittest discover -s tools/perf -p "test_windows*.py" -v
      - name: Build real Release Host and safe MMF harness
        id: release-build
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --offline -p icem-host-app --bin icem-host-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --offline -p icem-platform-windows --example windows_release_measure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --offline -p icem-platform-windows --example windows_live_load
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure Windows Release fixtures
        shell: pwsh
        run: |
          python tools/perf/windows_release.py --output "$env:RUNNER_TEMP/icem-release-measurements"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure real live-reader load and process resources
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/perf/windows_live_load.py --output "$env:RUNNER_TEMP/icem-release-measurements/live"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Profile warmed allocation windows separately from latency
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/perf/windows_heap_window.py --output "$env:RUNNER_TEMP/icem-release-measurements/heap-window"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Profile Windows heap separately from latency
        if: ${{ !cancelled() && steps.release-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $HeapPath = "$env:RUNNER_TEMP/icem-release-measurements/heap"
          python tools/perf/windows_heap.py --output $HeapPath
          if ($LASTEXITCODE -ne 0) {
            $SummaryPath = Join-Path $HeapPath 'heap-summary.json'
            if (-not (Test-Path -LiteralPath $SummaryPath -PathType Leaf)) { throw 'Heap profile failed without evidence' }
            $Summary = Get-Content -Raw -LiteralPath $SummaryPath | ConvertFrom-Json
            # Only an intact cleanup and a recognized ETW recording loss can trigger a new capture.
            if ($Summary.status -ne 'OPEN' -or @($Summary.cleanup_errors).Count -ne 0 -or
                $Summary.error -notmatch 'Events were lost in this trace|ETW lost events/buffers') {
              throw "Heap profile failure is not recoverable ETW loss: $($Summary.error)"
            }
            Write-Warning 'Heap trace lost ETW events; preserving first evidence and attempting one new independent capture.'
            $RetryPath = "$env:RUNNER_TEMP/icem-release-measurements/heap-retry"
            python tools/perf/windows_heap.py --output $RetryPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $RetrySummary = Get-Content -Raw -LiteralPath (Join-Path $RetryPath 'heap-summary.json') | ConvertFrom-Json
            if ($RetrySummary.status -ne 'RECORDED_RAW_HEAP_TOTALS' -or @($RetrySummary.cleanup_errors).Count -ne 0) {
              throw 'Repeated heap capture did not produce clean evidence'
            }
            'Heap capture: first attempt rejected due to ETW event loss; independent verified retry accepted. Both captures archived.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload raw Release measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-measurements
          path: ${{ runner.temp }}/icem-release-measurements
          if-no-files-found: ignore
          retention-days: 14
