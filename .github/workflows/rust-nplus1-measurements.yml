name: rust-nplus1-measurements
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-measurements:
    runs-on: windows-latest
    # Independent cold Release/GPUI build must not exhaust the debug gate's budget.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real Release Host and safe MMF harness
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --offline -p icem-host-app --bin icem-host-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --offline -p icem-platform-windows --example windows_release_measure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure Windows Release fixtures
        shell: pwsh
        run: |
          python tools/perf/windows_release.py --output "$env:RUNNER_TEMP/icem-release-measurements"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw Release measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-measurements
          path: ${{ runner.temp }}/icem-release-measurements
          if-no-files-found: ignore
          retention-days: 14
