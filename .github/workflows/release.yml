name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  msi:
    name: Build and publish MSI release
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract version from tag
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "Tag '$env:GITHUB_REF_NAME' does not match 'v<x.y.z>' (e.g. v1.4.4)."
            exit 1
          }
          $version = $Matches[1]
          Add-Content -Path $env:GITHUB_ENV -Value "MSI_VERSION=$version"
          Write-Host "MSI_VERSION=$version"
        shell: pwsh

      - name: Set up .NET SDK 10.0.x (global.json picks the exact band)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WiX v5 toolset
        run: dotnet tool install --global wix --version 5.0.2
        shell: pwsh

      - name: Add dotnet global tools to PATH
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          Write-Host "Added $env:USERPROFILE\.dotnet\tools to PATH for subsequent steps"
        shell: pwsh

      - name: Build MSI
        run: installer/build-msi.ps1 -MsiVersion $env:MSI_VERSION -NoPause
        shell: pwsh

      - name: Compute SHA256 checksums
        run: |
          $msi = Get-Item -LiteralPath "dist/legacy/iCemDataMonitor-$($env:MSI_VERSION)-x64.msi"
          $hash = (Get-FileHash -Path $msi.FullName -Algorithm SHA256).Hash
          $line = '{0}  {1}' -f $hash, $msi.Name
          Set-Content -LiteralPath dist/legacy/SHA256SUMS.txt -Value $line -Encoding ascii
          Write-Host $line
        shell: pwsh

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "dist/legacy/iCemDataMonitor-$($env:MSI_VERSION)-x64.msi"
          if (-not (Test-Path -LiteralPath $msi)) { Write-Host "Missing artifact: $msi"; exit 1 }
          gh release create "$env:GITHUB_REF_NAME" $msi dist/legacy/SHA256SUMS.txt `
            --title "iCem Data Monitor $env:GITHUB_REF_NAME" --generate-notes
        shell: pwsh
