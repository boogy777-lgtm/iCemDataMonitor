name: rust-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  inputs:
    uses: ./.github/workflows/ci-inputs.yml
  rust:
    needs: inputs
    if: needs.inputs.outputs.rust == 'true'
    uses: ./.github/workflows/rust-migration.yml
  packaging:
    needs: inputs
    if: needs.inputs.outputs.packaging == 'true'
    uses: ./.github/workflows/rust-installer-contracts.yml
  gate:
    name: Rust CI gate
    timeout-minutes: 5
    if: always()
    needs: [inputs, rust, packaging]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require selected Rust checks and reject unexpected skips
        shell: pwsh
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/ci/routing.py gate --family rust
