name: opc-runtime-acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - shared/opc-runtime/installer/**
      - shared/opc-runtime/tools/**
      - shared/opc-runtime/.gitattributes
      - shared/installer/.config/dotnet-tools.json
      - shared/installer/tools/WindowsMsiDatabase.psm1
      - .github/workflows/opc-runtime-acceptance.yml
permissions:
  contents: read
jobs:
  build-blocked-runtime:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.423
      - name: Verify test isolation and unchanged production block (no installation)
        shell: pwsh
        run: |
          ./shared/opc-runtime/tools/Test-SharedOpcRuntimeSafety.ps1
          ./shared/opc-runtime/tools/Test-SharedOpcAcceptance.ps1
      - id: matrix
        shell: pwsh
        run: |
          $Cases = Get-Content shared/opc-runtime/installer/acceptance-cases.json -Raw | ConvertFrom-Json
          if ($Cases.schema_version -ne 1) { throw 'Unsupported acceptance matrix' }
          'value=' + (@{ case = @($Cases.cases) } | ConvertTo-Json -Compress) >> $env:GITHUB_OUTPUT
      - name: Build source-pinned blocked runtime (no installation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = $PWD.Path
          $Work = Join-Path $env:RUNNER_TEMP ('opc-build-' + [guid]::NewGuid().ToString('N'))
          $Context = Join-Path $Work 'sdk'
          $Tools = Join-Path $Work 'tools'
          $Source = Join-Path $Work 'upstream'
          $Core = Join-Path $Work 'core'
          $Diagnostics = Join-Path $Root 'artifacts/opc-build'
          [IO.Directory]::CreateDirectory($Context) | Out-Null
          Import-Module "$Root/shared/opc-runtime/tools/WindowsBuildSdk.psm1" -Force
          Initialize-WindowsBuildSdk $Context
          Push-Location $Context
          try {
            $null = Assert-WindowsBuildSdk
            $Pin = (Get-Content "$Root/shared/installer/.config/dotnet-tools.json" -Raw | ConvertFrom-Json).tools.wix.version
            & dotnet tool install wix --version $Pin --tool-path $Tools
            if ($LASTEXITCODE -ne 0) { throw 'Pinned WiX install failed' }
            $env:PATH = "$Tools;$env:PATH"
            & dotnet build "$Root/shared/opc-runtime/installer/tests/RegistryGuardTests.csproj" -c Release "-p:BaseIntermediateOutputPath=$Work/test-obj/" "-p:OutputPath=$Work/test-bin/" -v:minimal
            if ($LASTEXITCODE -ne 0) { throw 'Read-only component-owner guard fixtures did not compile' }
            & "$Work/test-bin/icem-opc-guard-tests.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Component-owner guard fixtures failed' }
            & dotnet build "$Root/shared/opc-runtime/installer/tests/RegistryGuardTests.csproj" -c Release -p:StartupObject=Icem.OpcCoreGuard.NativeClientQuery -p:AssemblyName=icem-opc-native-query-tests "-p:BaseIntermediateOutputPath=$Work/native-test-obj/" "-p:OutputPath=$Work/native-test-bin/" -v:minimal
            if ($LASTEXITCODE -ne 0) { throw 'Native client-query fixture did not compile' }
            & "$Work/native-test-bin/icem-opc-native-query-tests.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Native read-only MSI client-query fixture failed' }
            & git init $Source
            & git -C $Source remote add origin https://github.com/OPCF-Members/OPC-Classic-CoreComponents.git
            & git -C $Source fetch --depth 1 origin efe0d1d1ea86a8a727bf26a501a261765e836766
            if ($LASTEXITCODE -ne 0) { throw 'Pinned OPC source fetch failed' }
            & "$Root/shared/opc-runtime/installer/Build-OpcCore.ps1" -SourceRepository $Source -OutputDirectory $Core -Toolchain VS2022v143
            $Raw = Join-Path $Work 'raw-enum'
            [IO.Directory]::CreateDirectory($Raw) | Out-Null
            & tar -xf "$Core/source-upstream.tar" -C $Raw 'Source/Common/ServerEnumerator/OpcSeLst.cpp'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot extract pinned enumeration source for its fixture' }
            & "$Root/shared/opc-runtime/installer/Test-OpcEnumEnumeration.ps1" -UpstreamSource "$Raw/Source/Common/ServerEnumerator/OpcSeLst.cpp"
            & "$Root/shared/opc-runtime/installer/Test-OpcGuidInventory.ps1" -IncludeDirectory "$Core/stage-x86/include"
            & "$Root/shared/opc-runtime/installer/Test-OpcNativeInventory.ps1" -CoreBuildDirectory $Core
            $Artifact = Join-Path $env:RUNNER_TEMP 'blocked-opc-runtime'
            [IO.Directory]::CreateDirectory($Artifact) | Out-Null
            & "$Root/shared/opc-runtime/installer/Build-SharedRuntime.ps1" -CoreBuildDirectory $Core -OutputFile "$Artifact/runtime.msi"
            Copy-Item "$Core/build-metadata.json" $Artifact
          } finally {
            [IO.Directory]::CreateDirectory($Diagnostics) | Out-Null
            foreach ($Arch in @('x86', 'x64')) {
              $Include = Join-Path $Core "stage-$Arch/include"
              if (Test-Path -LiteralPath $Include) {
                $Destination = Join-Path $Diagnostics $Arch
                [IO.Directory]::CreateDirectory($Destination) | Out-Null
                Copy-Item -Path "$Include/*_i.c" -Destination $Destination
              }
              if (Test-Path "$Core/native-$Arch.wxs") { Copy-Item "$Core/native-$Arch.wxs" $Diagnostics }
            }
            if (Test-Path "$Core/build-metadata.json") { Copy-Item "$Core/build-metadata.json" $Diagnostics }
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opc-build-diagnostics
          path: artifacts/opc-build/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: blocked-opc-runtime
          path: ${{ runner.temp }}/blocked-opc-runtime/*
          if-no-files-found: error
  disposable-installation:
    needs: build-blocked-runtime
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-blocked-runtime.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.423
      - uses: actions/download-artifact@v4
        with:
          name: blocked-opc-runtime
          path: ${{ runner.temp }}/blocked-opc-runtime
      - name: Native install contracts on this disposable runner only
        shell: pwsh
        env:
          ICEM_ACCEPTANCE_CASE: ${{ matrix.case }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = $PWD.Path
          $Context = Join-Path $env:RUNNER_TEMP ('opc-test-sdk-' + [guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($Context) | Out-Null
          Import-Module "$Root/shared/opc-runtime/tools/WindowsBuildSdk.psm1" -Force
          Initialize-WindowsBuildSdk $Context
          Push-Location $Context
          try {
            $null = Assert-WindowsBuildSdk
            $Pin = (Get-Content "$Root/shared/installer/.config/dotnet-tools.json" -Raw | ConvertFrom-Json).tools.wix.version
            & dotnet tool install wix --version $Pin --tool-path "$Context/tools"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned WiX install failed' }
            $env:PATH = "$Context/tools;$env:PATH"
          } finally { Pop-Location }
          & "$Root/shared/opc-runtime/tools/Test-SharedOpcRuntime.ps1" -Msi "$env:RUNNER_TEMP/blocked-opc-runtime/runtime.msi" -Case $env:ICEM_ACCEPTANCE_CASE -EvidenceDirectory "$Root/artifacts/opc-runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opc-runtime-${{ matrix.case }}-evidence
          path: artifacts/opc-runtime/*
          if-no-files-found: warn
