  topic: "3-layer VariableId design for FUTURE named coverage of COM/LAN sources (adversarial review v2 — survived-version)"
  long_form: "specs/iCemAddIn/FUTURE_full_coverage_spec.md (user-decreed md, 2026-08-18) — human-readable spec; THIS yaml = machine-readable source of the same facts"
  inputs_verified:
