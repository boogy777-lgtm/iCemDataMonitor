  - decision: "PROMOTION-CANDIDATE (§15.2): 3-layer VariableId design for FUTURE named coverage (enum / alias sidecar / closed address law) survives the adversarial review ONLY as Э8_design_variableid.yaml v2 (identity = name not DB ID, per-authority enums, append-only address book with contract tests, tiered coverage, 100% lives solely in the ace_full reserve under a future zone decree); implementation ONLY on explicit user decree; long-form: specs/iCemAddIn/FUTURE_full_coverage_spec.md"
