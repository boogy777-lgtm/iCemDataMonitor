  - decision: "PRODUCER-OWNED MIGRATION (decree владельца 2026-08-27): миграция формата v2–v4 → v5 выполняется ТОЛЬКО в AddIn при BusWriter.Open под bus-mutex (UpgradeToV5FullInPlace); consumer-side миграция (Host BusMapping.UpgradeIfNeeded) УДАЛЕНА; host открывает Data.dat строго READ-ONLY (FileAccess.Read + Read views) — создания файла и записи в host больше НЕТ"
