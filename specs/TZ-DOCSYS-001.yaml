# ─────────────────────────────────────────────────────────────
# SYSTEM RULES — how the doc system is built and maintained
system_rules:
  principle: |
    ∀ fact ∈ specs/ ⇔ fact ∉ derivable-in-one-grep from code ∧ fact NEEDED to reason across process boundaries.
    Doc answers: WHO writes/reads WHAT bytes WHERE with WHICH invariant and WHAT failure mode.
    Doc ¬ answers: how the code is written line-by-line.
    specs record STATE, ¬ process: no incident logs, no change history, no migration narration.
  stage_ladder:   # Э0-Э7 per unit; one file per stage; csv/yaml/mermaid only
    Э0_mission:   "yaml: why the unit exists; inputs/outputs; kill-criteria"
    Э1_topology:  "mermaid flowchart ONLY: processes, ports, MMF sections, files, adapters; every edge = protocol name"
    Э2_contracts: "csv tables: every wire/register/field row = (name,address/offset,type,byte_order,owner_writer,readers,units,scale)"
    Э3_statemachines: "mermaid stateDiagram: supervision FSM, acquisition FSM, case FSM; transitions carry guards"
    Э4_invariants: "boolean algebra lines: ∀/∃/¬ laws (single-writer, ordered-restart, fail-fast, stale-hold); each law ⇒ falsifiable check (test name)"
    Э5_seams_config: "csv: every config key/ini/settings.xml field = (key,default,scope,effect,restart_required)"
    Э6_failures: "csv failure-pattern table: (symptom_signature,likely_cause,probe_command,remediation) — current-state diagnostic rows"
    Э7_verification: "csv: test_name → proves_invariant → surface (unit/contract/live-gate); Category=Live marked"
  per_unit_tree: |
    specs/iCemEmule/{Э0..Э7}
    specs/iCemAddIn/{Э0..Э7 + Э8}
    specs/dotnet-server/{Э0..Э7}
    specs/stand_topology.mmd        # the one cross-unit mermaid
  density_rules:
    - "one fact = one row/line; ¬ sentences"
    - "mermaid allowed ONLY where parent→child or state→state edges exist"
    - "byte offsets in hex ∧ decimal both: 0x18(24)"
    - "every Э4 law ⇒ ∃ test name in Э7 (¬ orphan law)"
    - "every Э6 row ⇒ probe command copy-pastable (PowerShell or icemdatamonitor-cli)"
  update_law: "Δcode touching contract/topology/invariant ⇒ Δspecs in SAME commit (the Δ records the NEW STATE, ¬ the change narrative); CI-gate = grep-check (banned: ascii boxes; required: Э2 row per public register)"
  quality_gate: "5-DIM (agent-dna.md): min(dim)≥6 ∧ sum≥35 per file"

ownership:
  specs_law: "unit owner writes its Э-files; cross-unit edges (topology) = architect"
