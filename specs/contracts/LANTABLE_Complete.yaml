# Date: 2026-08-10
# Authority: lantable_extracted.xml (from Halliburton.iCem.CementingData.Units.dll embedded resource)
# Verified against: AceFrameParser.cs regression harness (33 PASS / 0 FAIL on iCemCrio.pcapng.bin)

meta:
  total_signals: 4386
  unique_value_types: 12
  xml_source: "tools/ace_replay/lantable_extracted.xml"
  embedded_resource: "Halliburton.iCem.CementingData.Units.dll / LantableNT.xml"
  regression_harness: "tools/ace_replay/ (AceFrameParser + Program.cs, 33 tests)"
  signal_base_offset: 24  # frame[24] = byte 0 of signal area (after Equipment + SV)
  frame_length: 152
  payload_length: 124     # frame[28:152] = signal area
  sentinel_value: -9999.0 # "no data" marker — applies to ALL numeric types
  endianness: BIG_ENDIAN  # all multi-byte types (NI cRIO LabVIEW convention)

