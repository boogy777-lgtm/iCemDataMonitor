  cdab_pins: "1.0f → [0x0000, 0x3F80]; 15.79f → [0xA3D7, 0x417C]; roundtrip; cross-check vs ModbusTcpPublisher formula (bits & 0xFFFF, bits >> 16)"
  magic_version: "Magic == 0x424E5453; MagicBytes == 'STNB'; Version == 1; LayoutVersion == 5; RegCount == 10001 (current default, ¬ anchor); HeaderRegCount == 4; BodyBytes == 20002; TotalFileBytes == 20066"
  state_registers: "4 pins: RegComPort=0, RegCaseState=1, RegCaseLanState=2, RegHeartbeat=3; HeaderRegCount=4; HeartbeatWrap=32000; NO overlap with com_stream (first com pair = reg 4)"
  frozen_history: "RegHeartbeat MOVED 5→3; regs 4..15 are com_stream float pairs again (the v4 skip rule is GONE); frozen v4 consts compile-compat only"
  dynamic_shapes: "IsValidShape TRUE for (magic,1,5,10001,20066) ∧ any N ∈ [650..65535] with len==64+2N at layoutVer 5; FALSE for bad magic, version≠1, layoutVer∉{5} (1,2,3,4,6), regCount 649/65536, any length mismatch"
  upgrade_rule: "IsUpgradeable TRUE for (1,2,650,1364) ∧ (1,3,1650,3364) ∧ (1,3,8404,16872) ∧ (1,4,8404,16872) exactly; FALSE for final (1,5,10001,20066) ∧ v1 (1,1,600,1264 — DEAD) ∧ all mismatches; every expansion lands at layoutVer=5 ∧ 10001/20066 ∧ preserves the old body byte-exact ∧ zeroes the tail (byte-level tests); v2 expansion also zeroes header 49..63"
  reserved_ace_full: "AceFullBaseReg=600 ∧ AceFullEndReg=10000 ∧ AceFullRegCount=9401; NO writer maps into 600..10000; NO WitsSlots/slot-table surface on BusLayout (removed — debt_4); former wits slot addresses live in §3 frozen_history"
  ini_validate: "defaults (wits_len=0, lan_ext_len=0, total=10001) → valid; accepts total ∈ {650, 1650, 8404, 10001, 65535} (no 'total' error); rejects total 649/65536, overlap, out-of-range vs total, base < 4, odd length, bad ports, modbus_tick_ms outside [200..500]; 2026-08-31: com_port + com/lan/raw zone keys removed (retired — accepted-and-ignored)"
  publisher_map_edge: "publisher serves the FULL dictionary — map edge at 10001; words beyond 8403 (the grown tail) read zero-hold until a future writer claims ace_full; header mirror = words 0..3 (HeaderRegCount, auto-follows the const)"

