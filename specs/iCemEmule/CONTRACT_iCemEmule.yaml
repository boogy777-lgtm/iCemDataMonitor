hard_requirements:
  R1: "¬ MongoDB. Ни одной ссылки на MongoDB.* / RealtimeDB. Эмулятор пишет ТОЛЬКО в COM-порт и LAN multicast."
  R2: "Данные обновляются ровно 1 раз/сек (1 Hz tick). Без checkbox 'Deterministic' и любых per-variable чекбоксов."
  R3: "Два независимых потока: LAN (ACE raw 802.3 multicast) ∧ COM (FLECS serial). Каждый включается/выключается отдельно. У каждого — своя вкладка."
  R4: "LAN: кадры строго по PROTOCOL.md §1 так, чтобы iCem.exe нативно sniff-ил их без изменений iCem."
  R5: "COM: при смене шаблона в dropdown набор передаваемых полей перестраивается НА ЛЕТУ (следующий тик уже новый формат, без рестарта потока/приложения)."
  R6: "LAN: при смене equipment/srcMac/adapter перестройка на лету (читаются каждый тик). Набор sv ФИКСИРОВАН = 20 sv (6 legacy + 14 firmware Beartooth), полный список в ace_wire.superframe_svs. [AMENDED 2026-08-17: legacy 6 sv сохранены в прежнем порядке без изменений — это field-verified сет, который iCem нативно читает; добавлены 14 таблиц прошивки (RT Data/Observer/Bool/Totals/HPVT/Pump Life/Blend/Strings/Spare/DI/Relay), имена сигналов 1:1 из C:\\RE, каждая таблица ≤124 Б. Ранее AMENDED 2026-08-10: template dropdown на LAN-вкладке удалён — мёртвый контрол; cross-family links в variable_registry отсутствуют (0 vars lan+flecs), все lan simulation = flat 0 ⇒ data-gap, ¬ code-gap. Значения FF-сигналов станут живыми автоматически, когда в variable_registry.json lan-family simulation заполнится данными — AcePayloadProvider уже читает этот путь, смена кода = 0.]"
  R7: "Единицы: ОДНО глобальное меню единиц на вкладке \"Units\" (влияет на COM и LAN). Пресеты: FirmwareDefault (gpm/°C/ppg/psi/bbl/ft), LanNative (bbl/min/°F/lb-gal), Metric (m³/min/°C/g-cc/bar/m), Imperial (bbl/min/°F/ppg/psi/ft) + per-group переопределения (UnitsOf). LAN: внешний декоратор UnitConvertingPayloadProvider конвертирует payload каждый тик; COM: значения конвертируются в EmuEngineHost.Tick до FormatLine (W11.4+; TrayApp удалён). Примечание: \"bpm\" не конвертируется (единица прошивки = identity, защита от неверной конверсии PS/DS Rate в gpm). [AMENDED 2026-08-17: добавлено правило firmware-native: под пресетом Прошивка конвертируются только legacy-нативы bbl/min и °F; нативы gal/min/°c/lb-gal/g-cc/bbl/ft/psi — identity (NeedsConversion). Плюс кросс-групповой guard в Convert (GroupOf(to)!=group ⇒ identity).]"

