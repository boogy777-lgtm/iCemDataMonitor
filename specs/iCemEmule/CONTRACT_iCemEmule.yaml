# ─── ACE wire constants (PROTOCOL.md §1, ¬ изменять) ───────────────────────
ace_wire:
  frame_total_bytes: 152          # 14 Eth + 3 LLC + 3 Magic + 8 Header + 124 Payload
  dst_mac: "03:00:01:00:00:20"    # L2 multicast group
  src_mac_default: "00:80:2F:23:F4:44"   # NI OUI (cRIO из захвата) — историческая константа; движок шлёт srcMac="" ⇒ auto-MAC открытого адаптера (настройки LanSrcMac больше нет)
  ieee8023_length: 0x008A         # =138, НЕ EtherType
  llc: [0x03, 0x03, 0x08]         # DSAP, SSAP, Control I-frame N(S)=4 (константа, ¬ инкремент)
  magic: [0x00, 0xD0, 0x0D]       # offsets 17..19 — фильтр iCem
  equipment_offset: 0x14          # uint32 BE, default 0x00A86F46 (11038534), configurable
  sv_offset: 0x18                 # uint32 BE
  payload_offset: 0x1C            # 124 bytes
  superframe_svs: [0x13120203, 0x13120206, 0x13120200, 0x13120209, 0x1312020C, 0x1312020F,
                   0x13120212, 0x13120215, 0x13120218, 0x1312021B, 0x1312021E, 0x13120221,
                   0x13120224, 0x13120227, 0x1312022A, 0x1312022D, 0x13120230, 0x13120233,
                   0x13120236, 0x13120239]
                   # [AMENDED 2026-08-17: +14 firmware-таблиц Beartooth (RT Data/Observer/Bool/Totals/HPVT/Pump Life/Blend/Strings/Spare/DI/Relay),
                   #  имена 1:1 из C:\RE, все ≤124 Б. Первые 6 — legacy Cementer (полевой verified-сет, порядок не менять).]
  pacing: "каждый sv ровно 1 Hz; бёрст в конце секунды по паттерну cRIO-дампа: старт ≈0.938 с, интервал ≈5.25 мс между кадрами (порядок как в superframe_svs)"
  signal_encoding:
    FF: "float32 BE (IEEE754); sentinel = -9999.0f"
    UL: "uint32 BE; value = round(sim * dasFactor)"
    SI: "int32 BE; value = round(sim * dasFactor)"
    HX: "uint32 BE hex"
    UC: "ASCII, NUL-padded до size"
    default: "4 байта zeros"

# ─── Единицы измерений (R7, dropdown «Units») ────────────────────────────
unit_presets:
  presets: { 0: FirmwareDefault, 1: LanNative, 2: Metric, 3: Imperial }
  units_per_preset:
    FirmwareDefault: { Flow: gpm,      Temperature: °C,   Density: ppg,    Volume: bbl, Level: ft, Pressure: psi }
    LanNative:       { Flow: bbl/min,  Temperature: °F,   Density: lb/gal, Volume: bbl, Level: ft, Pressure: psi }
    Metric:          { Flow: m³/min,   Temperature: °C,   Density: g/cc,   Volume: m³,  Level: m,  Pressure: bar }
    Imperial:        { Flow: bbl/min,  Temperature: °F,   Density: ppg,    Volume: bbl, Level: ft, Pressure: psi }
  conversions_native_to_target:
    - { from: "bbl/min", to: "gpm",     factor: 42.0 }
    - { from: "bbl/min", to: "m³/min",  factor: 0.158987 }
    - { from: "gpm",     to: "m³/min",  factor: 0.00378541 }
    - { from: "ppg",     to: "g/cc",    factor: 0.119826 }
    - { from: "psi",     to: "bar",     factor: 0.0689476 }
    - { from: "ft",      to: "m",       factor: 0.3048 }
    - { from: "bbl",     to: "gal",     factor: 42.0 }
    - { from: "°F",      to: "°C",      formula: "(v-32)*5/9" }
    # Кодирование на проводе: native → preset (ToTarget); CommitEdit: preset → native (ToWire).
    # Неизвестные/неконвертируемые единицы (составные X/Y, UC-строки, mA, %, Hz, bpm) — identity, без изменений.
  firmware_native_rule:
    # Правило NeedsConversion (защита 1:1 «прошивка ⇄ провода»): под пресетом FirmwareDefault
    # конвертируются ТОЛЬКО legacy-нативные единицы bbl/min (Flow) и °F (Temperature);
    # firmware-native единицы {gal/min, °c, lb/gal, g/cc, bbl, ft, psi} — identity
    # (прошивка уже передаёт их в своих единицах; пересчёт ломал соответствие — кейс MB_DensHPVT g/cc).
    # Плюс кросс-групповой guard в Convert: GroupOf(to) != GroupOf(from) ⇒ identity для ВСЕХ групп.
    # Под остальными пресетами (LanNative/Metric/Imperial) — обычная конверсия.
  overrides_per_group:
    # Переопределение группы = своя единица вместо пресетной (вкладка «Units», ComboBox «По пресету» + UnitsOf).
    # TargetUnit(group) = непустой *Override иначе единица пресета.
    Flow:        { override_unit: "любая из UnitsOf(Flow) — bbl/min, gpm, gal/min, m³/min",  default: "по пресету" }
    Temperature: { override_unit: "°F, °C",                                                    default: "по пресету" }
    Density:     { override_unit: "ppg, lb/gal, g/cc, kg/m³",                                  default: "по пресету" }
    Volume:      { override_unit: "bbl, gal, m³",                                              default: "по пресету" }
    Level:       { override_unit: "ft, m",                                                     default: "по пресету" }
    Pressure:    { override_unit: "psi, bar, kPa",                                             default: "по пресету" }
    # GroupOf(unit): конвертируются только известные группы (Flow/Temperature/Density/Volume/Level/Pressure);
    # "bpm" → None (единица прошивки, identity — PS/DS Rate НЕ конвертируется в gpm).

# ─── FLECS serial wire constants ────────────────────────────────────────────
com_wire:
  baud: 9600
  parity: None
  dataBits: 8
  stopBits: One
  line: "позиционный CSV по шаблону, terminator CRLF"
  formats: { elapsed: "F1 (секунды от старта потока)", int: "целое", default: "F2" }
  invariant_culture: true
  rate: "1 строка/сек"

# ─── Contract types (C# сигнатуры — единственные границы) ───────────────────
contracts:
  # Core → все
  DeviceTemplate: |
    public sealed class DeviceTemplate {
      public string Name; public string DeviceType;
      public int[] AutoSelectIndices;           // может быть пустым
      public TemplateVariable[] Variables;      // отсортированы по Index
      public int FieldCount => Variables.Length;
    }
    public sealed class TemplateVariable {
      public int Index; public string Name; public string LegacyName; public string UoM;
      public double BaseValue; public double Amplitude; public double Frequency;
      public string Format;                     // "elapsed" | "int" | "" (=>F2)
      public double TogglePeriod;               // >0 => digital toggle 0/1
      public bool ExcludeFromTelemetry;
    }
  # Core: движок симуляции (1 Hz, stateful по elapsed)
  ISimulationEngine: |
    public interface ISimulationEngine {
      IReadOnlyList<DeviceTemplate> Templates { get; }          // весь каталог (все deviceType)
      DeviceTemplate Current { get; }
      void SetTemplate(string deviceType, string templateName); // hot swap, thread-safe, следующий Tick = новый набор
      double[] Tick();                // значения по Current.Variables, длина = FieldCount
      void ResetClock();              // elapsed=0 (при старте потока)
      event Action? TemplateSwapped;
    }
    // waveform: elapsed=>elapsed; toggle=>(int)(elapsed/TogglePeriod)%2;
    //           amp>0&&freq>0 => base + amp*sin(2π f elapsed); else base.   (БЕЗ deterministic-ветки)
  # Core: LAN payload provider (domain-знание lantable)
  IAcePayloadProvider: |
    public sealed record AceVectorData(uint SvNumber, string Name, byte[] Payload /*124 bytes*/);
    public interface IAcePayloadProvider {
      // Набор sv для текущего шаблона/equipment. Перечитывается emitter'ом после TemplateSwapped.
      IReadOnlyList<AceVectorData> GetSuperframe(uint equipmentNumber, double elapsedSeconds);
      IReadOnlyList<uint> ActiveSvNumbers { get; }   // default = ace_wire.superframe_svs
    }
    // Маппинг значений: lantable_registry.json (signals: byteOffset,size,valueType,dasFactor,name)
    //   значение сигнала = simulation из variable_registry.json по совпадению name ↔ families.lan.wireName/alias,
    //   иначе константа base (или 0). waveform — те же правила, что ISimulationEngine.
  # Emitters (транспорт, ¬ domain)
  IComEmitter: |
    public interface IComEmitter : IDisposable {
      bool IsOpen { get; } string? PortName { get; } long LinesSent { get; }
      string Open(string portName);              // "" = OK, иначе текст ошибки
      void SendLine(string line);                // добавляет CRLF сам; thread-safe
      void Close();
      event Action<string>? StatusChanged;
    }
  IAceLanEmitter: |
    public interface IAceLanEmitter : IDisposable {
      bool IsOpen { get; } string? AdapterName { get; } long FramesSent { get; }
      static IReadOnlyList<string> ListAdapters();          // SharpPcap CaptureDeviceList, friendly descr
      string Open(string adapterDescriptionOrName);        // "" = OK, иначе текст ошибки (вкл. "Npcap not found")
      void SendSuperframe(IReadOnlyList<AceVectorData> vectors, uint equipmentNumber, string srcMac);
      //   ^ строит 152-байт кадры по ace_wire ∧ инжектит бёрстом (cRIO-паттерн):
      //     старт ≈0.938 с, интервал ≈5.25 мс; >6 sv ⇒ старт сдвигается, чтобы бёрст не вылез за секунду;
      //     вызывается 1 раз/сек извне.
      void Close();
      event Action<string>? StatusChanged;
    }

