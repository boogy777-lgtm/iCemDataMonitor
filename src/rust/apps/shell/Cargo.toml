[package]
name = "icem-shell-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "icem-shell-dev"
path = "src/main.rs"

[dependencies]
icem-transport = { path = "../../crates/icem-transport" }
icem-platform-windows = { path = "../../crates/icem-platform-windows" }

[target.'cfg(windows)'.dependencies]
icem-config = { path = "../../crates/icem-config" }
icem-desktop = { path = "../../crates/icem-desktop" }
icem-web = { path = "../../crates/icem-web" }
tonic = { version = "=0.14.6", default-features = false }
tokio = { version = "1", features = ["rt","time"] }

