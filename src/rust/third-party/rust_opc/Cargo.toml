[workspace]
resolver = "3"
members = ["opc_classic_abi", "opc_classic_types", "opc_classic_utils", "opc_comn_bindings", "opc_da_bindings"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
opc_classic_abi = { path = "opc_classic_abi" }
opc_classic_types = { version = "0.1.0", path = "opc_classic_types" }
opc_classic_utils = { version = "0.4.0", path = "opc_classic_utils" }
opc_comn_bindings = { version = "0.4.0", path = "opc_comn_bindings" }
opc_da_bindings = { version = "0.4.0", path = "opc_da_bindings" }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_WinRT",
] }
windows-bindgen = "0.66.0"
windows-core = "0.62.2"

[profile.dev.build-override]
debug = true
