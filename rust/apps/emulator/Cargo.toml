[package]
name = "icem-emulator-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "icem-emulator-dev"
path = "src/main.rs"

[dependencies]
icem-protocols = { path = "../../crates/icem-protocols" }
icem-emulation = { path = "../../crates/icem-emulation" }
icem-platform-windows = { path = "../../crates/icem-platform-windows" }
icem-config = { path = "../../crates/icem-config" }
icem-transport = { path = "../../crates/icem-transport" }

serde_json = "1"

[[bin]]
name = "icem-dfb-dev"
path = "src/dfb.rs"

[[bin]]
name = "icem-lan-dev"
path = "src/lan.rs"

[[bin]]
name = "icem-emulator-engine-dev"
path = "src/engine.rs"
