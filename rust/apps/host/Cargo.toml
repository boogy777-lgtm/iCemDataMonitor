[package]
name = "icem-host-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "icem-host-dev"
path = "src/main.rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rumqttc = { version = "=0.25.1", default-features = false }
tokio = { version = "1", features = ["rt", "time", "macros"] }
icem-logging = { path = "../../crates/icem-logging" }
icem-transport = { path = "../../crates/icem-transport" }
icem-platform-windows = { path = "../../crates/icem-platform-windows" }
icem-protocols = { path = "../../crates/icem-protocols" }
icem-bus = { path = "../../crates/icem-bus" }
icem-config = { path = "../../crates/icem-config" }
icem-core = { path = "../../crates/icem-core" }

icem-web = { path = "../../crates/icem-web" }

[target.'cfg(windows)'.dependencies]
icem-windows-native = { path = "../../crates/icem-windows-native" }
icem-desktop = { path = "../../crates/icem-desktop" }

