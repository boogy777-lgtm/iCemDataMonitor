[package]
name = "icem-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
unicode-segmentation = "=1.12.0"
icem-windows-native = { path = "../icem-windows-native" }
icem-platform-windows = { path = "../icem-platform-windows" }

gpui-tray = { version = "=0.1.4", default-features = false, features = ["gpui"] }
image = { version = "=0.25.10", default-features = false, features = ["ico"] }
icem-core = { path = "../icem-core" }
