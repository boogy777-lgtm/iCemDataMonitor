[package]
name = "icem-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
icem-logging = { path = "../icem-logging" }
icem-bus = { path = "../icem-bus" }
icem-core = { path = "../icem-core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "server", "channel"] }
tonic-web = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[build-dependencies]
tonic-prost-build = { version = "=0.14.6", default-features = false }
protoc-bin-vendored = "=3.3.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
icem-platform-windows = { path = "../icem-platform-windows" }
