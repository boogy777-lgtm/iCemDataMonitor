[package]
name = "icem-windows-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0001: sole audited FFI exception; workspace forbid stays unchanged elsewhere.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "=0.6.2", features = ["std"] }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Devices_Communication", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_System_SystemInformation"] }
