[package]
name = "icem-emulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Explicit build target, not automatic OS or runtime detection. The default is
# the historical 19045 provider; see the provider compatibility policy.
ordinal-icu-26100 = []

[dependencies]
icem-config = { path = "../icem-config" }
icem-protocols = { path = "../icem-protocols" }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
