<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">Архитектура iCemDataMonitor: COM и LAN, iCem/AddIn, MMF и Rust Host</title>
<desc id="desc">Реальные COM/FLECS и LAN/ACE источники либо отдельный эмулятор через com0com и Npcap поступают во внешний legacy iCem. AddIn .NET48 является единственным писателем MMF. Rust Host читает MMF одним acquisition с периодом 200 мс и публикует неизменяемый Arc Snapshot для Modbus, MQTT, OPC UA и OPC DA sidecar. Web, GPUI Shell и CLI используют API Host. Пассивный LAN sniffer не пишет MMF.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
