<text x="75" y="1058" font-size="21" fill="#334155" font-weight="400" text-anchor="start">LAN sniffer Host — пассивная диагностика; он не записывает данные в MMF.</text>
<text x="50" y="1112" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">com0com и Npcap — внешние драйверы. Внутренний приёмник iCem находится за границей репозитория.</text>
